[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ─────────────────────────────────────────────────────────────────────────────
# Single-service architecture — Python only, no Node.js required:
#   - Dashboard (vanilla JS + Tailwind CDN) served from dashboard/index.html
#   - API routes at /api/*
#   - Trading worker runs in a background daemon thread
#   - DB is SQLite (local) unless DATABASE_URL is set (Railway PostgreSQL)
#
# Required env vars (set in Railway dashboard → Variables):
#   ALPACA_API_KEY      your Alpaca paper key
#   ALPACA_SECRET_KEY   your Alpaca paper secret
#   DASHBOARD_SECRET    any password you choose (for dashboard login)
#   GMAIL_USER          gmail address for daily reports
#   GMAIL_APP_PASSWORD  Gmail app password (not your login password)
#   NOTIFY_EMAIL        where to send the daily email
#
# Optional:
#   DATABASE_URL        Railway PostgreSQL URL (auto-set if you add the plugin)
#   ANTHROPIC_API_KEY   enables AI anomaly diagnosis
# ─────────────────────────────────────────────────────────────────────────────
